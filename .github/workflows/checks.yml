name: Code checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql+psycopg://check:unused@127.0.0.1:1/check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend/app backend/tools backend/tests
      - run: python -m ruff format --check backend/app backend/tools backend/tests scripts
      - run: python -m unittest discover -s backend/tests -p "test_*.py"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ai-snooker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/ai-snooker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
